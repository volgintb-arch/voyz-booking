name: Android — build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk voyz-booking.apk
      - uses: actions/upload-artifact@v4
        with:
          name: voyz-booking-apk
          path: voyz-booking.apk
      # A fixed pre-release "android-latest" always holds the newest APK,
      # so the link to download it never changes.
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest voyz-booking.apk \
            --prerelease \
            --title "Android — последняя сборка" \
            --notes "Тестовая сборка из ветки main (${GITHUB_SHA::7}). Установка: скачайте voyz-booking.apk на телефон Android и откройте файл."
