name: Server — keep awake

# Render's free plan puts the server to sleep after 15 idle minutes. A sleeping
# server misses link previews (Telegram, WhatsApp give up after a few seconds),
# answers the bot late and pauses background jobs. Remove this once the server
# is on a paid plan or its own VPS.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.VITE_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${API_URL%/}/health"
        env:
          API_URL: ${{ vars.VITE_API_URL }}
