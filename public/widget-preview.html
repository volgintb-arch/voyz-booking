<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Виджет Voyz Booking — предпросмотр</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, sans-serif; background: #f4f1ea; color: #1e1e1e; }
    header { background: #2f3b2a; color: #fff; padding: 18px 20px; }
    header b { font-size: 20px; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
    .note { background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; }
    h2 { margin: 28px 0 12px; font-size: 18px; }
  </style>
</head>
<body>
  <header><b>Сайт вашего объекта</b></header>
  <main>
    <p class="note">
      Так виджет выглядит на вашем сайте. Справа внизу — плавающая кнопка «Забронировать»,
      ниже — форма брони внутри страницы. Брони отсюда настоящие и попадут в шахматку.
    </p>
    <h2>Форма брони внутри страницы</h2>
    <div id="slot"></div>
  </main>
  <script>
    // ?p=<property code>: both widget variants for that property.
    var slug = new URLSearchParams(location.search).get('p') || '';
    if (slug) {
      var slot = document.getElementById('slot');
      slot.setAttribute('data-voyz-booking', slug);
      slot.setAttribute('data-height', '760');
      var s = document.createElement('script');
      s.src = 'widget.js';
      s.async = true;
      s.setAttribute('data-property', slug);
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
